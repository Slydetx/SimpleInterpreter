version: 2

# One group shared by both ecosystems: all bumps arrive as a single weekly PR
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  # pom.xml dependencies and plugin versions
  - package-ecosystem: maven
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  # actions/* versions pinned in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
